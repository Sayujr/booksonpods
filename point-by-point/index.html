<style>
/* Layout: a single reading column of paper on a desk; each letter is a sheet you open in turn, styled by what it physically is (airmail letter, email, postcard, card). */
:root {
  --desk: #dde3ea;
  --desk-ink: #4a5566;
  --paper: #fbfcfd;
  --paper-edge: #d3dae3;
  --ink: #1f2633;
  --ink-soft: #5b6475;
  --air-red: #b8323a;
  --air-blue: #24407a;
  --postmark: rgba(36, 64, 122, 0.55);
  --screen: #ffffff;
  --screen-bar: #eef1f5;
  --card: #f6f1e7;
  --btn: #24407a;
  --btn-ink: #ffffff;
  --shadow: 0 1px 2px rgba(20, 30, 50, .08), 0 8px 24px rgba(20, 30, 50, .10);
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-hand: "La Belle Aurore", "Segoe Script", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #10151f; --desk-ink: #9aa6b8; --paper: #1b2230; --paper-edge: #2c3546; --ink: #e7e4dc; --ink-soft: #a7afbd;
    --air-red: #d4555c; --air-blue: #6f8fd0; --postmark: rgba(140, 165, 220, 0.55); --screen: #161c28; --screen-bar: #222a3a;
    --card: #262420; --btn: #6f8fd0; --btn-ink: #0d121b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #10151f; --desk-ink: #9aa6b8; --paper: #1b2230; --paper-edge: #2c3546; --ink: #e7e4dc; --ink-soft: #a7afbd;
  --air-red: #d4555c; --air-blue: #6f8fd0; --postmark: rgba(140, 165, 220, 0.55); --screen: #161c28; --screen-bar: #222a3a;
  --card: #262420; --btn: #6f8fd0; --btn-ink: #0d121b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
html { background: var(--desk); }
body {
  background: var(--desk); color: var(--ink); font-family: var(--f-body); font-size: 1.1rem; line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 7rem;
}
.wrap { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 2.5rem; }
header.cover { padding-block: 4.5rem 1rem; text-align: left; display: flex; flex-direction: column; gap: .6rem; }
.cover .kicker { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--desk-ink); }
.cover h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(2.8rem, 9vw, 4.4rem); line-height: 1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.cover p { margin: 0; color: var(--desk-ink); font-size: 1.05rem; max-width: 32rem; }
.airline { height: 8px; width: 9rem; background: repeating-linear-gradient(-45deg, var(--air-red) 0 10px, transparent 10px 14px, var(--air-blue) 14px 24px, transparent 24px 28px); border-radius: 1px; }

/* sheets */
.sheet { position: relative; background: var(--paper); box-shadow: var(--shadow); border-radius: 3px; padding: 2.4rem 2.2rem 2.2rem; min-width: 0; }
.sheet.letter, .sheet.open { border: 1px solid var(--paper-edge); }
.sheet.open { border-image: repeating-linear-gradient(-45deg, var(--air-red) 0 10px, var(--paper) 10px 14px, var(--air-blue) 14px 24px, var(--paper) 24px 28px) 8; border-width: 8px; border-style: solid; }
.sheet p { margin: 0 0 1em; }
.sheet p:last-child { margin-bottom: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.6rem; }
.head .who { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); line-height: 1.5; }
.head .who .meta { display: block; text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-style: italic; font-size: .95rem; margin-top: .2rem; }
.postmark { flex: none; width: 5.6rem; height: 5.6rem; border: 2px solid var(--postmark); border-radius: 50%; display: grid; place-items: center; text-align: center; color: var(--postmark); font-family: var(--f-mono); font-size: .62rem; line-height: 1.25; letter-spacing: .06em; text-transform: uppercase; transform: rotate(-9deg); position: relative; }
.postmark::after { content: ""; position: absolute; left: 100%; top: 30%; width: 3.2rem; height: 40%; background: repeating-linear-gradient(to bottom, var(--postmark) 0 2px, transparent 2px 7px); }
.postmark b { display: block; font-size: 1rem; font-weight: 500; letter-spacing: 0; }
.salutation { font-style: italic; }
.closing { margin-top: 1.6em !important; margin-bottom: .1em !important; }
.sig { font-family: var(--f-hand); font-size: 1.7rem; line-height: 1.2; color: var(--air-blue); margin-bottom: 1.4em !important; }
.ps { padding-top: .8em; border-top: 1px dashed var(--paper-edge); font-size: 1rem; }
.quote { font-style: italic; margin-left: 1.4em !important; padding-left: 1em; border-left: 2px solid var(--air-red); }

/* email */
.sheet.email { background: var(--screen); padding: 0; border: 1px solid var(--paper-edge); border-radius: 8px; overflow: hidden; }
.sheet.email .bar { background: var(--screen-bar); padding: .9rem 1.4rem; font-family: var(--f-mono); font-size: .78rem; color: var(--ink-soft); display: grid; grid-template-columns: auto 1fr; gap: .15rem .9rem; }
.sheet.email .bar span:nth-child(odd) { text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; padding-top: .1rem; }
.sheet.email .content { padding: 1.4rem 1.4rem 1.6rem; font-family: var(--f-body); }
.sheet.email .sig { font-family: var(--f-body); font-size: 1.1rem; color: var(--ink); }

/* postcard and card */
.sheet.postcard, .sheet.card { background: var(--card); border: 1px solid var(--paper-edge); }
.sheet.postcard { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1.6rem; }
.sheet.postcard .msg { min-width: 0; border-right: 1px solid var(--paper-edge); padding-right: 1.6rem; }
.sheet.postcard .addr { display: flex; flex-direction: column; gap: 1rem; align-items: flex-end; }
.stamp { width: 4.2rem; height: 5rem; border: 2px dotted var(--air-red); display: grid; place-items: center; font-family: var(--f-display); font-style: italic; color: var(--air-red); font-size: 1rem; }
.addr .lines { align-self: stretch; display: flex; flex-direction: column; gap: 1.2rem; padding-top: 1rem; }
.addr .lines div { border-bottom: 1px solid var(--paper-edge); font-family: var(--f-hand); font-size: 1.3rem; color: var(--air-blue); min-height: 1.6rem; }
@media (max-width: 560px) {
  .sheet { padding: 1.8rem 1.25rem 1.6rem; }
  .sheet.postcard { grid-template-columns: 1fr; }
  .sheet.postcard .msg { border-right: 0; padding-right: 0; }
  .sheet.postcard .addr { flex-direction: row; justify-content: space-between; align-items: center; }
  .addr .lines { display: none; }
  .postmark { width: 4.6rem; height: 4.6rem; }
  .postmark::after { display: none; }
}

/* reveal */
.sheet.arrive { animation: arrive .55s cubic-bezier(.2,.7,.2,1); }
@keyframes arrive { from { transform: translateY(18px) rotate(-.6deg); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet.arrive { animation: none; } }


/* one letter per screen */
html { scroll-snap-type: y proximity; }
#stack { display: flex; flex-direction: column; }
.slot { min-height: 100vh; min-height: 100svh; scroll-snap-align: start; scroll-margin-top: 0; display: flex; flex-direction: column; justify-content: center; padding-block: 3.5rem 6.5rem; }
.slot + .slot { border-top: 1px solid var(--paper-edge); }
.slot .sheet { scroll-margin-top: 0; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: .8rem max(16px, env(safe-area-inset-right, 0px)) calc(.8rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--desk) 65%, transparent); display: flex; justify-content: center; }
.dock .inner { max-width: 40rem; width: 100%; display: flex; align-items: center; justify-content: flex-end; gap: .6rem; }
.dock .inner #prev { margin-right: auto; }
@media (max-width: 480px) { .dock .inner .btn { padding: .75rem .85rem; font-size: .7rem; letter-spacing: .05em; } }
.count { font-family: var(--f-mono); font-size: .75rem; color: var(--desk-ink); letter-spacing: .06em; flex: 1; min-width: 8rem; }
.count .next { display: block; font-family: var(--f-body); font-style: italic; font-size: .95rem; letter-spacing: 0; color: var(--ink); }
button { font: inherit; cursor: pointer; }
.btn { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; border: 0; border-radius: 999px; padding: .85rem 1.3rem; background: var(--btn); color: var(--btn-ink); }
.btn.ghost { background: var(--paper); color: var(--desk-ink); border: 1px solid var(--paper-edge); }
.btn:focus-visible, .linkish:focus-visible { outline: 2px solid var(--air-red); outline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: default; }
.end { padding-top: 1rem; text-align: center; font-family: var(--f-display); font-style: italic; font-size: 1.5rem; color: var(--desk-ink); display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.linkish { background: none; border: 0; color: var(--desk-ink); text-decoration: underline; text-underline-offset: 3px; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .06em; padding: 0; }
</style>

<div class="wrap">

    <h1>Point by Point</h1>
    <p>A correspondence, with a review of <em>The Correspondent</em> by Virginia Evans</p>
  </header>
  <main id="stack"></main>

</div>

  </div>
</nav>

<script>
const LETTERS = [{"n": 1, "date": "October 19, 2026", "meta": "Open letter from R. to all of you. No address on the envelope.", "kind": "open", "from": "R.", "to": "all of you", "body": [{"cls": "salutation", "html": "Dear all of you, however many of you are still out there,"}, {"cls": "p", "html": "I will begin with a confession, though you of all people already know it. When I was a child, I had pen pals. You. Not one of you, but a great many. At one point there were more of you than I could easily keep track of. A boy three hundred miles away at the other end of my state, a girl on the far side of the country, a friend of a friend who had moved abroad. I would come home from school and the first thing I did, before food, before anything, was check the post for you."}, {"cls": "p", "html": "Some of you wrote back only once or twice. Others wrote to me more times than I could count. And I suspect many of you have forgotten what it felt like. Not a letter, exactly, but the whole business of one. The waiting, the arriving, the reading, the answering."}, {"cls": "p", "html": "So let me remind you what it was like, because I was recently reminded myself, by a book I will tell you about if you write back, and I want to pass that favour on. Your letter would come, say on a Tuesday. I would not open it straight away. I would carry it around. I would look at your handwriting on the envelope, the stamp, the postmark. Then I would find a quiet place, and open it, and read it once fast, greedily, and then again, slowly. Sometimes three times. Then it went on my desk, and for days it sat there while I composed my answer in my head. On the bus, in the shower, in boring lessons. I suspect you did the same with mine."}, {"cls": "p", "html": "And the objects. You will remember the objects. One of you used thin blue airmail paper, so thin I could see the writing from the back. One of you wrote in green ink, always green, and I never found out why. One of you drew little cartoons in the margins. One of you always put a joke in the postscript, so I learned to read your P.S. first, like dessert."}, {"cls": "p", "html": "Postscripts were everything. Some of you saved the most important thing for the P.S., as if you had not dared to put it in the letter itself. And you sent things. A photograph. A pressed leaf from the tree outside your window. A newspaper cutting with an article you thought I would like. A ticket stub from a concert. And one of you, once, sent a single feather, with no explanation. I still have it, and I still do not know what it meant. Which is part of the point. A letter is a physical thing that has travelled from your hands to mine. I was holding something you had held."}, {"cls": "p", "html": "And then you faded, one by one. One of you would take a little longer to reply. Then longer. Then a letter would come that was shorter than usual, and I could feel it in the shortness. And then one day I would realise I had not heard from you for three months, and I would write a cheerful little letter pretending nothing had changed, and nothing came back. Ghosted by post, long before the word existed. It hurt more than people think, because we had shared so much on paper. But that was part of the education too. You taught me that every correspondence ends, and that you should say the important things while the other person is still writing back."}, {"cls": "p", "html": "Which is why I am writing now. Because here is the embarrassing truth. I have lost your names. Not all of them, but most. And I have lost every one of your addresses. The shoebox survived, mostly, but somewhere along the way, through moves and years and a different country, the envelopes went, and with them the street names and the house numbers I once wrote out so carefully that I knew them by heart."}, {"cls": "p", "html": "Some of your letters still exist, I think. Not in the shoebox. In books. Because that is what I used to do with a letter I loved. I would fold it once and keep it in whatever I was reading, as a bookmark, so that every time I opened the book, there you were. And those books are on shelves in another country now, in a house I do not live in any more. I do not know if they are still there. I do not know if anyone has opened them. I do not know if I will ever find a single one of those letters again."}, {"cls": "p", "html": "So this is the only way I can think of to write back. I am sending this out into the ether. A letter with no address on the envelope."}, {"cls": "closing", "html": "With love, and expecting a reply,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. If you were the boy with the green ink, or the girl with the thin blue airmail paper, or the one who drew cartoons in the margins, or whoever sent me a feather with no explanation, and somehow, by some strange chance, this reaches you, then I would love to hear from you. You do not have to answer point by point. You do not even have to remember me very well. Just tell me what has happened to you since your last letter. It has been a long interval. I imagine there is a lot to say."}]}, {"n": 2, "date": "October 26, 2026", "meta": "Email from D. to R.", "kind": "email", "from": "D.", "to": "R.", "body": [{"cls": "salutation", "html": "R.,"}, {"cls": "p", "html": "My wife read your letter aloud at breakfast this morning and stopped halfway through to ask whether this was my old pen friend. I think it is."}, {"cls": "p", "html": "I was not the green ink or the airmail paper or the cartoons. I was the one who always asked about your grandmother, which you may not remember. What I remember is that you answered my letters like an exam paper, every one of my questions in order, sometimes numbered, and nobody has written to me that way since."}, {"cls": "sig", "html": "D."}]}, {"n": 3, "date": "October 26, 2026", "meta": "Email from R. to D.", "kind": "email", "from": "R.", "to": "D.", "body": [{"cls": "salutation", "html": "D.,"}, {"cls": "p", "html": "Of course I remember. I have read your few lines more times than I will admit. Please send me your postal address, because I am not answering this by email. A real letter is coming, and you are going to have to find a stamp."}, {"cls": "sig", "html": "R."}]}, {"n": 4, "date": "October 30, 2026", "meta": "Letter from R. to D.", "kind": "letter", "from": "R.", "to": "D.", "body": [{"cls": "salutation", "html": "Dear D.,"}, {"cls": "p", "html": "You came back. I cannot tell you what it did to me to see your name in my inbox. I walked around for the rest of the day the way I used to walk around with an unopened envelope."}, {"cls": "p", "html": "You said I answered your letters like an exam paper. I did, but an exam paper I actually cared about. That was the form of the reply, and it is the thing I most want to remember with you. A good reply was not just news. It was a conversation stretched across two weeks. So I would go through your letter point by point. You asked about my sister. She is fine, she has broken her arm, here is how. You said you had been reading a book I recommended, and you hated the ending. I want to argue with you about that. You asked what I thought about your new teacher. Here is what I think."}, {"cls": "p", "html": "And then, after I had answered all your points, I would tell you what had happened to me since my last letter. The interval. Everything that had happened in those two weeks. And here is the strange part. I would be telling the same events to several people, because I had so many of these going."}, {"cls": "p", "html": "Not identical times. That is the point. Each of you had picked up different things from my last letter. You always asked about my grandmother, so in your letter I would tell you about her, and in telling you, I would notice things about her I had not noticed. Another friend loved arguments, so to her I would tell the same week as a series of things I disagreed with. Another was going through a hard time, so to him I would tell the gentle version."}, {"cls": "p", "html": "Exhausting? It was wonderful. Because think about what it was doing. Several times a month, I was retelling my own life, to different people, from different angles, with different emphasis. Each retelling refined it a bit. I would find a better way to describe something. I would realise that the thing I thought was funny was actually sad. Or the thing I was upset about was actually ridiculous. The same event, turned in the light, again and again, until I understood it."}, {"cls": "p", "html": "So the letters were a way of thinking. They were the best way of thinking I have ever had. Someone once said that the unexamined life is not worth living. Well, the epistolary life is the most examined life there is. You cannot help examining it, because you have to explain it to someone you love, in writing, at a distance, and they are going to write back and ask you what you meant."}, {"cls": "p", "html": "So write back and ask me what I meant. And tell me everything that has happened to you since. I have time now."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. My grandmother will need a letter of her own. I am not ready to write it yet, but when I am, you will be the one I tell."}]}, {"n": 5, "date": "November 10, 2026", "meta": "Letter from D. to R.", "kind": "letter", "from": "D.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "After we hung up on Sunday I realised we had talked for an hour and a half and you had still not told me about your grandmother, so I am asking again in writing, where you cannot change the subject. Your letter has been on the kitchen table all week, and the children have started calling it Dad's letter, as if it were a pet."}, {"cls": "p", "html": "Point by point, then, since that is how we do this. You asked about the children. They are well, both taller than me now, and both convinced that writing a letter is something people do in museums. You asked about work. I will explain it when I can make it sound interesting. You asked whether I still read, and the honest answer is not enough."}, {"cls": "p", "html": "The line about the unexamined life is Socrates, by the way, and he never wrote anything down at all."}, {"cls": "p", "html": "And a question of my own. You say you told the same fortnight to all of us, differently each time. Which version did I get?"}, {"cls": "closing", "html": "Yours,"}, {"cls": "sig", "html": "D."}, {"cls": "ps", "html": "P.S. I bought stamps. The woman at the post office asked whether I was all right."}]}, {"n": 6, "date": "November 11, 2026", "meta": "Postcard from R. to D.", "kind": "postcard", "from": "R.", "to": "D.", "body": [{"cls": "salutation", "html": "D.,"}, {"cls": "p", "html": "Which might explain a lot about Socrates."}, {"cls": "p", "html": "You got the version with my grandmother in it. It was always the best one. A proper letter is coming soon."}, {"cls": "sig", "html": "R."}]}, {"n": 7, "date": "November 12, 2026", "meta": "Letter from M. to R.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "You will not remember me. I wrote you two letters when we were eleven and then stopped, which I suppose makes me one of the ones who wrote back only once or twice. A colleague forwarded your letter to me last week with a note asking whether I had been one of your pen pals, and I have been carrying it around ever since, which I suspect you would say means something."}, {"cls": "p", "html": "I should make a confession of my own. I think I have written maybe five letters in my entire life, and most of those were thank you notes my mother made me write. So when you say you want to remind us what it felt like, that is a lot of pressure to put on a thank you note writer."}, {"cls": "p", "html": "And I want to push back, because I am a little suspicious. Your letter is lovely, but it reads like a memory that has been polished for an audience. You chose the airmail paper, the feather and the green ink. Isn't that just what we now call curating, choosing the best angle? It is exactly what people complain about with social media. Everyone presents a version of themselves, and an open letter is about as public a version as there is."}, {"cls": "sig", "html": "M."}, {"cls": "ps", "html": "P.S. Did you really read every letter twice?"}]}, {"n": 8, "date": "November 18, 2026", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "I do remember. I had lost your name along with the others, but not your two letters. They are in the shoebox. And yes, I read every letter at least twice, sometimes three times. Yours included."}, {"cls": "p", "html": "You are right that an open letter is a broadcast. It was the one thing I wrote that was not really a letter, and it is why I am glad to be writing this one, to you alone. Your objection is a serious one, and I want to take it properly."}, {"cls": "p", "html": "Here is the difference, I think. Social media is a broadcast. You polish one version for everyone at once, and the response is instant, and it is mostly a number. Likes, views. A letter is addressed to one person. You are not performing for a crowd. You are trying to be understood by someone specific, who knows you, who remembers what you said last time, and who will notice if you are being false."}, {"cls": "p", "html": "And they will notice. I had a pen pal who, every single time I wrote that I was fine, would write back, you said you were fine three times in that letter, so what is actually wrong? You cannot hide from a good correspondent. The delay works against hiding. They have days to read your letter. They read between the lines."}, {"cls": "p", "html": "When there were many of you, I told the same fortnight to each of you differently, and you might think that proves your point. But each version was shaped by someone who would write back and ask me what I meant, which is a very different thing from choosing an angle for a crowd."}, {"cls": "p", "html": "And there is the other thing. Time. Nothing in a letter happens in real time. By the time you write about something, it has already happened. Days ago, maybe weeks. You are not reacting. You are reflecting. And by the time they read it, more time has passed. So what you get is not the event. It is the event, filtered through you, filtered through time, and then received by someone else at another moment in their life."}, {"cls": "p", "html": "Less like a conversation and more like a series of essays, perhaps. It is both. That is the magic. It is an essay addressed to a friend."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}]}, {"n": 9, "date": "November 21, 2026", "meta": "Letter from L. to R.", "kind": "letter", "from": "L.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "I teach history now, and one of my older students found your letter online and brought it in, because she knows I collect old letters. She had no idea she was handing it to one of the people it was written to. I read it at my desk during a free period and then had to sit for a while before the next class."}, {"cls": "p", "html": "I was the one who counted. Whenever you wrote that you were fine, I counted how many times, and I would like you to know I intend to carry on. Your letter says a great deal about all of us and almost nothing about how you are."}, {"cls": "p", "html": "My mother still asks after you. She remembers you as the child who wrote more letters than anyone she had ever met, and she was not entirely sure it was healthy."}, {"cls": "p", "html": "So, how are you, actually?"}, {"cls": "closing", "html": "Love,"}, {"cls": "sig", "html": "L."}, {"cls": "ps", "html": "P.S. You did not use the word fine once in that letter. I am not sure whether that is better or worse."}]}, {"n": 10, "date": "November 27, 2026", "meta": "Letter from M. to R.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "I will concede a little. Writing to one person who knows you is not the same as posting to everyone, and I can see that now."}, {"cls": "p", "html": "But I still think there is something artificial about it. When I talk to someone I can hear their voice and see their face, and they interrupt me. A letter is a monologue. You get to say everything you want, and no one can stop you, which, I notice, is exactly what you did for four pages."}, {"cls": "sig", "html": "M."}, {"cls": "ps", "html": "P.S. I bought proper writing paper for this. Do not make anything of it."}]}, {"n": 11, "date": "December 3, 2026", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "I would say that is exactly why a letter is so revealing. People say things in letters they would never say aloud. Because no one is interrupting them. Because there is a distance. Because they can take their time and find the words."}, {"cls": "p", "html": "Or, you could answer, because they can hide behind the words. And yes. Both. And that tension, hiding and revealing at once, is exactly why letters became one of the great forms of the novel."}, {"cls": "p", "html": "Which means, I am afraid, a lecture. A short one. Well. A medium one."}, {"cls": "p", "html": "The epistolary novel, a novel told in letters, is very old. The scholar Janet Gurkin Altman, in a book called Epistolarity, from 1982, traces the letter as an art form all the way from the Roman poet Ovid to Saul Bellow. Ovid wrote a collection called the Heroides, imaginary letters from the heroines of myth to the men who had left them. Penelope writing to Ulysses, asking when he is coming home."}, {"cls": "p", "html": "Notice that. The first letters in literature are from women who have been abandoned. Which tells you something about the form. A letter is written across an absence. You only write to someone who is not there."}, {"cls": "p", "html": "But the novel in letters really takes off in eighteenth century England, with a printer called Samuel Richardson. In 1740 he publishes Pamela. A young servant girl, writing to her parents about the master of the house, who is trying to seduce her. It begins like this."}, {"cls": "quote", "html": "Dear Father and Mother, I have great trouble, and some comfort, to acquaint you with."}, {"cls": "p", "html": "And it was a sensation. People read it aloud in groups. And Richardson had a phrase for what he was doing. He called it writing to the moment. Because Pamela writes while things are still happening. She does not know how her story ends. She writes in fear, in hope, in confusion, and the reader is right there with her."}, {"cls": "p", "html": "That is enough for one envelope."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. I have made nothing of the paper. It is very good paper."}]}, {"n": 12, "date": "December 9, 2026", "meta": "Letter from M. to R. On the good paper.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "Great trouble, and some comfort. That is a good opening line, and I have been saying it to myself all week, mostly about work. And the point about absence, that you only write to someone who is not there, is actually very good."}, {"cls": "p", "html": "But now my objection comes back. If she is writing while it is all happening, who stops in the middle of being chased around a house by a nobleman to write a long letter to their parents?"}, {"cls": "sig", "html": "M."}]}, {"n": 13, "date": "December 12, 2026", "meta": "Letter from D. to R.", "kind": "letter", "from": "D.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "Your postcard is on the fridge, next to a drawing of a horse that may also be a dog."}, {"cls": "p", "html": "The school play went well, since you asked on the phone. My son was a tree and did not fall over, which at his age counts as a triumph. My daughter has announced that she wants a pen pal, which I am choosing to see as your fault."}, {"cls": "p", "html": "I have been thinking about the book you mentioned in your open letter, the one that reminded you. Is it a novel told in letters? I have never really understood how those work. I am an engineer, so naturally I want to know how the machine works. What can a novelist do with letters that cannot be done any other way?"}, {"cls": "closing", "html": "Yours,"}, {"cls": "sig", "html": "D."}, {"cls": "ps", "html": "P.S. The grandmother letter. I am still waiting."}]}, {"n": 14, "date": "December 15, 2026", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "You are in good company. Henry Fielding thought exactly the same thing. In 1741, a year after Pamela, he published a parody called Shamela, in which the heroine writes letters at absurd moments, describing things happening to her in the present tense as she writes. Fielding thought the whole form was ridiculous, and that Pamela was not innocent but a calculating schemer."}, {"cls": "p", "html": "Everyone likes Fielding. But Richardson kept going. In 1748 he published Clarissa, which is one of the longest novels in the English language. Close to a million words. Hundreds of letters between multiple writers. And it is a tragedy, about a young woman pursued and destroyed by a man called Lovelace. And because we read Lovelace's letters too, we see inside the villain's head at the same time as we see inside the victim's."}, {"cls": "p", "html": "A million words of letters. And Samuel Johnson, who loved Richardson, gave the most famous warning about him. He told Boswell, if you were to read Richardson for the story, your impatience would be so much fretted that you would hang yourself. But you must read him for the sentiment, and consider the story as only giving occasion to the sentiment."}, {"cls": "p", "html": "A backhanded compliment if ever there was one. But it is also exactly right about the form. In an epistolary novel, the plot is slow, because everything has to be written down, sent, received, answered. What you get instead is the inside. The feeling. The reflection. The story is only the occasion for the letters. The slowness is the point."}, {"cls": "p", "html": "And then the French took the form and turned it into a weapon. Pierre Choderlos de Laclos, in 1782, Les Liaisons dangereuses. Dangerous Liaisons. Two aristocrats, the Marquise de Merteuil and the Vicomte de Valmont, who use letters to seduce, deceive and destroy people. And the brilliance of it is that we, the readers, see every letter. We know who is lying to whom. Every character only knows the letters they receive. We know them all."}, {"cls": "p", "html": "So the reader becomes the only person who sees the whole picture. That is one of the great structural powers of the form. The reader as the ultimate eavesdropper, reading everyone's private post. A bit creepy, when you put it like that? It is meant to be. Laclos makes you complicit. You enjoy the cruelty because you are reading it in private, as they wrote it in private."}, {"cls": "p", "html": "Then Goethe. The Sorrows of Young Werther, 1774. A young man writes letters to his friend about falling hopelessly in love with a woman who is engaged to someone else. And we only ever see Werther's letters, never the replies."}, {"cls": "p", "html": "One side of a conversation. And that silence is unbearable. You keep wanting to know what his friend is saying back, whether anyone is trying to help him. And the absence of the replies becomes part of the tragedy. It made Werther a European sensation. Young men dressed like him, in a blue coat and a yellow waistcoat. The first fan merchandise, more or less."}, {"cls": "p", "html": "And then there are novels that use letters as a frame. Frankenstein, in 1818, begins with letters from an explorer named Robert Walton to his sister in England, as he sails toward the North Pole. The whole story of Victor Frankenstein and his creature reaches us inside Walton's letters home. Listen to how it opens."}, {"cls": "quote", "html": "You will rejoice to hear that no disaster has accompanied the commencement of an enterprise which you have regarded with such evil forebodings."}, {"cls": "p", "html": "Wonderfully ironic, given what happens. And Dracula, in 1897, is built entirely from documents. Letters, diaries, newspaper cuttings, a ship's log, even recordings made on a phonograph and typed up. A whole group of people, each with their own fragment, and the vampire defeated partly by someone collating all the papers into one typewritten file."}, {"cls": "p", "html": "The heroes win by doing the admin. Or rather, they win by reading each other's letters, which is exactly the reader's position. And this is where I think the form becomes genuinely profound. In an ordinary novel, a narrator tells you what happened. In a novel in letters, nobody tells you what happened. You only get versions. Each character's version, at a particular moment, to a particular person."}, {"cls": "p", "html": "So where is the truth? The truth is in the gaps. Between the letters, between the writers, between what was meant and what was understood. And that gives you a kind of layering you cannot get any other way. The same event told several times. Told to different people. Told before and after the writer understood it. Told in a version that is softened for one reader and sharpened for another."}, {"cls": "p", "html": "Which, you will notice, is exactly what I was doing with all of you, all those years ago. The epistolary novel is the epistolary life, written down and read by a stranger."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}]}, {"n": 15, "date": "December 20, 2026", "meta": "Letter from R. to D.", "kind": "letter", "from": "R.", "to": "D.", "body": [{"cls": "salutation", "html": "Dear D.,"}, {"cls": "p", "html": "It is a novel in letters, and I will tell you about it properly soon. But you asked how the machine works, and I have been waiting years for someone to ask me that."}, {"cls": "p", "html": "There are several things a novelist can do with letters. One is the time lag. In a novel in letters, there is always a gap between something happening and someone hearing about it. So the reader often knows something terrible that a character does not know yet, because the letter carrying the news is still in the post. That is suspense built out of the postal service. Dramatic irony by mail."}, {"cls": "p", "html": "Another is the crossed letter. Two people write to each other at the same time, and their letters cross, so each one is answering a letter the other has not received yet. Misunderstandings pile up. Writers have had a lot of fun with that."}, {"cls": "p", "html": "Another is the unreliable narrator, multiplied. In a first person novel, you have one unreliable narrator. In a novel of letters, everyone is a narrator, and everyone is unreliable in a different way, to a different person. And then there is the letter as an object in the plot. Letters get stolen, hidden, burned, intercepted, read by the wrong person. A letter can be evidence. A letter can be a weapon. A letter can arrive too late."}, {"cls": "p", "html": "The scholar Janet Gurkin Altman, in a book called Epistolarity, defines the form through six structures. Mediation, the letter as the thing in between two people. Confidentiality, the privacy of it. Readership, the fact that every letter is shaped by who it is for. Closure, the question of how a story told in letters can ever end, when every letter invites a reply. Discourse, the way letters talk. And narrativity, the way a story gets built out of them."}, {"cls": "p", "html": "Closure is the interesting one. How do you end a correspondence? That is the question every epistolary novel has to solve. Someone stops writing. Someone dies. Someone arrives in person, so the letters are no longer needed. Or the last letter goes unanswered, and the silence is the ending. I would like ours to avoid all four."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. Tell your daughter I take full responsibility, and that she should look for someone who writes back."}]}, {"n": 16, "date": "January 3, 2027", "meta": "Letter from M. to R.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "I have been reading about Clarissa, against my better judgment, and I can confirm that Johnson was right about the impatience."}, {"cls": "p", "html": "But I want to be the devil's advocate again. Isn't the novel in letters a bit of a museum piece? It peaked in the seventeen hundreds, and nobody writes letters any more. If someone wrote a novel in letters now, wouldn't it feel like a costume drama?"}, {"cls": "sig", "html": "M."}]}, {"n": 17, "date": "January 4, 2027", "meta": "Card from R. to M.", "kind": "card", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "M.,"}, {"cls": "p", "html": "Three weeks and nothing. Have I lost you already?"}, {"cls": "p", "html": "Happy new year, in any case."}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. If this crosses with a letter from you, I take it all back."}]}, {"n": 18, "date": "January 6, 2027", "meta": "Letter from L. to R.", "kind": "letter", "from": "L.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "You still have not told me how you are, and I am a teacher, so I know exactly what it means when someone answers every question except the one that was asked."}, {"cls": "p", "html": "I keep a box of your letters under the stairs at my mother's house. I went through it over the holidays and found the one where you describe your first snow, which I had forgotten entirely. Do you still have ours?"}, {"cls": "p", "html": "And a favour, since you have turned me back into a correspondent. I would like an example to put in front of my class on a Monday morning, a real letter that outlived the person it was written to. You always knew where to find these things."}, {"cls": "closing", "html": "Love,"}, {"cls": "sig", "html": "L."}]}, {"n": 19, "date": "January 10, 2027", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "Our letters crossed, which is one of the oldest tricks the form has. I take it all back."}, {"cls": "p", "html": "You asked whether the novel in letters is a museum piece. That is exactly what people thought. And they were wrong. Altman's whole argument is that the form never disappeared. It kept coming back, in new shapes. Jane Austen, for example. Her early novella Lady Susan is entirely in letters. And there is a family tradition that the first version of Sense and Sensibility, called Elinor and Marianne, was written in letters too. Scholars argue about it. The critic D. W. Harding thought the story improbable, because it rests on a note made much later by Austen's niece. But most critics accept it."}, {"cls": "p", "html": "So Austen learned her craft in letters and then moved away from them. And she never quite let them go. The most famous moment in Persuasion is a letter. Captain Wentworth, who was rejected by Anne Elliot eight years before, is in a room with her, overhearing her talk about whether women love longer than men. And he cannot speak. So he writes, there and then, and leaves the letter for her."}, {"cls": "quote", "html": "You pierce my soul. I am half agony, half hope. Tell me not that I am too late, that such precious feelings are gone for ever."}, {"cls": "quote", "html": "I have loved none but you."}, {"cls": "p", "html": "That is a letter written in a room full of people. Writing to the moment, if ever there was one. The critic Mary Favret called it a silent explosion. And what does Anne do? She reads it, and she is overwhelmed, and she cannot speak to anyone for a while, because everything has changed and nobody else in the room knows. That is the thing about letters. An entire life can turn over in a room full of people, and only one person knows, because only one person has read the page."}, {"cls": "p", "html": "True of texts too, you might say. Someone reads a message across a dinner table and their face changes. It is true. But Wentworth could not have sent that as a text. It took him the whole conversation he was overhearing to write it. You can hear the pressure building in the sentences. Half agony, half hope. A text would have said, still love you, call me."}, {"cls": "p", "html": "But Austen is still a long time ago. So let us come forward. In 1964, Saul Bellow published Herzog, about a man in the middle of a breakdown who writes letters, constantly, to everyone. His ex wife, his friends, famous philosophers, even dead ones, even the President. And he almost never sends them."}, {"cls": "p", "html": "Unsent letters. Hold onto that, because it matters later. In 1970, Helene Hanff published 84 Charing Cross Road, which is not a novel but real letters. Twenty years of correspondence between a New York writer who could not afford rare books and a bookseller in London named Frank Doel, at the shop Marks and Company. They never meet. And it is one of the most loved little books of the century."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}]}, {"n": 20, "date": "January 14, 2027", "meta": "Letter from R. to L.", "kind": "letter", "from": "R.", "to": "L.", "body": [{"cls": "salutation", "html": "Dear L.,"}, {"cls": "p", "html": "Yes, I still have yours. And here is something about real letters that matters for all of this. They last. I have a shoebox of every letter my pen pals sent me. A few years ago I got it down and read them again. And what I found was not really them. It was me. Because their letters were full of replies to things I had said. You said you were scared about moving schools. You said you thought you might want to be a doctor. You said your dog was ill. My own younger self, preserved in other people's answers."}, {"cls": "p", "html": "It is strange. I had forgotten almost all of it. And there it all was, kept by someone else's handwriting. A letter is a kind of external memory. And not just for individuals. Historians depend on letters, as you know far better than I do. So much of what we know about how people actually felt in the past comes from private letters they never expected anyone else to read."}, {"cls": "p", "html": "A little unnerving, if you think about your own letters being read in two hundred years. That is the risk of writing honestly. And the reward."}, {"cls": "p", "html": "You asked for an example for your class. Abigail Adams, writing to her husband John in March 1776, while he was helping to plan American independence. She told him that in the new code of laws, he should remember the ladies, and be more generous and favourable to them than their ancestors had been. A private letter between a wife and a husband, and it has become one of the most quoted documents of the founding of the United States."}, {"cls": "p", "html": "Or Sullivan Ballou, a Union officer in the American Civil War, who wrote to his wife Sarah a week before the first battle of Bull Run in 1861, telling her how much he loved her and that if he did not return, she should know he would always be near her. He was killed in that battle. Millions of people know that letter now, from the Ken Burns documentary about the war. A letter written to one woman, read aloud to a whole country."}, {"cls": "p", "html": "Letters often end up reaching people they were never meant for. Which is exactly the position of the reader of an epistolary novel. You are always reading someone else's post. And the best letters seem to know, somewhere, that a stranger might be listening. Your student, carrying my letter into your classroom without knowing whose it was, is proof of that."}, {"cls": "p", "html": "And since you have now asked twice. I was tired this autumn, more tired than I let on to anyone, and I missed you all without quite knowing it until the replies began to come. That is the truth. You may count it."}, {"cls": "closing", "html": "Love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. You may read Ballou to your class. Please do not read them mine."}]}, {"n": 21, "date": "January 22, 2027", "meta": "Letter from M. to R.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "My mother loved 84 Charing Cross Road. She kept it by her bed for years and gave it to me when she moved into the smaller flat, so you have managed to make me cry on a Tuesday, which I will not forgive."}, {"cls": "p", "html": "But those were real letters, and you are supposed to be convincing me that the novel in letters survived. Name me something from our own lifetime."}, {"cls": "sig", "html": "M."}]}, {"n": 22, "date": "January 28, 2027", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "I am sorry about the Tuesday. I am not sorry about the book."}, {"cls": "p", "html": "There is one novel that everyone who loves letters has read. In 1982, Alice Walker published The Color Purple, which won the Pulitzer Prize. Celie, a young Black woman in the American South, abused and silenced, writes letters to God, because she has no one else to write to. And later, letters to and from her sister Nettie, which have been hidden from her."}, {"cls": "p", "html": "Letters to God. The ultimate absent reader. And it is devastating, because the form tells you how alone she is before the content does. Then 1991, Nick Bantock's Griffin and Sabine, where you actually open little envelopes glued into the book and pull out the letters. In 2004, Marilynne Robinson's Gilead, which won the Pulitzer, is a single long letter from an elderly minister to his young son, to be read after his death. A letter from the past to the future. Which every letter is, really."}, {"cls": "p", "html": "Then there is Lionel Shriver's We Need to Talk About Kevin, letters from a mother to her absent husband about their son. The Guernsey Literary and Potato Peel Pie Society, by Mary Ann Shaffer and Annie Barrows, letters just after the Second World War. Maria Semple's Where'd You Go, Bernadette, made of emails, notes, and documents."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}]}, {"n": 23, "date": "February 3, 2027", "meta": "Postcard from M. to R.", "kind": "postcard", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "R.,"}, {"cls": "p", "html": "All right, I accept that the form is alive. But your list proves my point a little. Emails, notes, documents. The letter keeps turning into something else."}, {"cls": "sig", "html": "M."}]}, {"n": 24, "date": "February 8, 2027", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "Yes. But I think that is the answer, not the problem. The form survives because the thing it is about survives. Absence, distance, the gap between writing and reading, the self you construct for a particular reader. Whether it is a quill, a typewriter or an email, those things do not change."}, {"cls": "p", "html": "And then there are real letters, which are their own kind of literature. Some of the greatest writing in English is in letters. John Keats came up with his most famous idea about poetry, negative capability, the ability to remain in uncertainties, mysteries, doubts, without reaching after fact and reason, in a letter to his brothers in December 1817. Flannery O'Connor's letters, collected as The Habit of Being, are as funny and fierce as her stories. Elizabeth Bishop and Robert Lowell wrote to each other for thirty years, and their letters are collected as Words in Air."}, {"cls": "p", "html": "Some writers are at their best in letters, because they are not trying to write literature. They are just trying to reach one person. And that is the secret. When you try to reach one person, you often reach everyone."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}]}, {"n": 25, "date": "February 12, 2027", "meta": "Letter from M. to R.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "I have to say, you are slowly getting to me."}, {"cls": "p", "html": "Now tell me about the book. You mentioned it in your very first letter, and I have been patient. I have not been patient."}, {"cls": "sig", "html": "M."}]}, {"n": 26, "date": "February 16, 2027", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "Then this is the letter I have been wanting to write since October. I have read it. You have not. And I am going to try to make you read it."}, {"cls": "p", "html": "It is called The Correspondent, by Virginia Evans. Published in April 2025. And it went straight onto my favourites shelf, which I have not done with a new novel in a very long time."}, {"cls": "p", "html": "It is about a woman called Sybil Van Antwerp. She has just turned seventy three. She is a retired lawyer, divorced, living alone in Annapolis. And she writes letters. She has written letters all her life. By hand, on good stationery she orders from England. And the whole novel is her letters, plus a few emails, and some of the letters people write back to her, over about ten years, from 2012 to 2022."}, {"cls": "p", "html": "Who does she write to? That is one of the joys of it. Everyone. Her brother, Felix. Her best friend. Her children. Former colleagues. And then people who have no idea who she is. She writes to authors, to tell them what she thought of their books. Joan Didion. Larry McMurtry. Ann Patchett."}, {"cls": "p", "html": "Not fan mail, exactly. More like critical mail. She is quite capable of telling a famous author exactly where they went wrong. And she writes to the president of a university who will not let her audit a class she wants to take, which is a wonderful running battle."}, {"cls": "p", "html": "She is formidable. She is also, in the words of a lot of reviewers, difficult. The reviewer Jayne, at Dear Author, said readers may have to grit their teeth at her sometimes, that she can be stubborn, intolerant and self righteous. On NPR, Mary Louise Kelly called her a bit cranky and uptight, but said you end up rooting for her."}, {"cls": "p", "html": "So not a lovable grandmother. Not remotely. She is sharp, funny, opinionated, and she has made mistakes, serious ones, that she has not faced. And the letters are how she slowly faces them. Library Journal said each letter is a compelling monologue that carries raw emotion and grief alongside humour and tart observations. Kirkus said it is thoughtful at times and laugh out loud funny at others."}, {"cls": "p", "html": "There is a plot, and I am not going to spoil it, because you are going to read it. But I will tell you the shape. There are two threads that pull you through. One is that Sybil is writing letters to someone she never sends them to. Letters with just a date at the top, no name. And you do not know who they are for."}, {"cls": "p", "html": "You may remember Herzog. It is like that, except that instead of a man ranting at the whole world, it is a woman writing to one particular person she cannot or will not send them to. And you spend a lot of the book wondering who it is and why."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. I did tell you to hold onto the unsent letters."}]}, {"n": 27, "date": "February 19, 2027", "meta": "Email from M. to R.", "kind": "email", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "R.,"}, {"cls": "p", "html": "A quick question before I lose my nerve and buy the book. You said there were two threads and only gave me one. And if it is all letters, to dozens of people over ten years, is it hard to follow? Some of these novels make you keep a chart."}, {"cls": "sig", "html": "M."}]}, {"n": 28, "date": "February 24, 2027", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "A chart? A little, at the very beginning. The Dear Author review said it takes some time to settle in and keep track of who is writing to whom, and I think that is fair. But every letter is clearly headed, with the date and the name, so you are never lost for long. And by about a third of the way in, you know these people. You recognise their voices before you look at the name. Her brother writes one way, her friend another. That is part of the pleasure. You learn to read handwriting, so to speak."}, {"cls": "p", "html": "And the other thread is that someone from Sybil's past writes to her, and it forces her to go back to a painful time in her life she has avoided. And the question becomes whether she can forgive, and whether she can be forgiven."}, {"cls": "p", "html": "All of it told only in letters. And here is why I think it is such a perfect example of everything I have been writing to you about. Because Sybil is doing exactly what I did with my pen pals. She is telling the same life to different people. To her brother, she is one way. To her best friend, another. To Joan Didion, she is an intellectual. To the boy she writes to, a friend's son who does not fit in anywhere and shares her love of books, she is gentle, and wise, and patient in a way she is not with anyone else."}, {"cls": "p", "html": "So the reader assembles her from all those versions. No single letter gives you the whole of Sybil. You build her from the angles. And the gaps are where the truth is. What she tells one person and hides from another. What she says to the unknown person in the unsent letters, which she would never say to anyone she actually posts a letter to. The structure is the character."}, {"cls": "p", "html": "And there is something else that struck me about the boy she writes to. There is a long tradition of letters from an older writer to a young person. The most famous is probably Rainer Maria Rilke's Letters to a Young Poet. Between 1903 and 1908, Rilke wrote ten letters to a young man called Franz Xaver Kappus, who had sent him some poems and asked for advice. Rilke barely commented on the poems. Instead he wrote about solitude, patience, love, how to live with questions you cannot yet answer. Life, through the excuse of poetry."}, {"cls": "p", "html": "And Sybil's letters to this boy have something of that quality. A lonely old woman and a lonely boy, finding each other on paper. She is often impossible with adults. With him she is different."}, {"cls": "p", "html": "And there is a beautiful idea in the book about time, too. Sybil has a theory about the seasons of a life. People like to say hard times are only a season. She does not accept that. Her view is that you only get one round of seasons. Childhood is spring, and so on. You do not get another spring. So whatever you are going to mend, you had better mend it."}, {"cls": "p", "html": "Bleak, perhaps. I would say bracing. And it is exactly why the letters matter. She is in her seventies. The window is closing. The letters are how she uses the time she has left."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}]}, {"n": 29, "date": "February 26, 2027", "meta": "Email from D. to R.", "kind": "email", "from": "D.", "to": "R.", "body": [{"cls": "salutation", "html": "R.,"}, {"cls": "p", "html": "You promised to tell me about the book back in December, and since then I have had crossed letters and closure and a great deal about my daughter's pen pal, but not one word about the book itself. Who wrote it? Is she famous?"}, {"cls": "sig", "html": "D."}, {"cls": "ps", "html": "P.S. Still no grandmother letter. I have started to take it personally."}]}, {"n": 30, "date": "March 2, 2027", "meta": "Letter from R. to D.", "kind": "letter", "from": "R.", "to": "D.", "body": [{"cls": "salutation", "html": "Dear D.,"}, {"cls": "p", "html": "It is The Correspondent, by Virginia Evans, and I have been describing it at great length to another old friend, so I will spare you the plot and tell you the part I think you will like best."}, {"cls": "p", "html": "She is not famous at all, or was not. She had written seven novels before this one that were never published. She was close to giving up and applying to law school. The Correspondent started as a writing exercise she did not plan to show anyone."}, {"cls": "p", "html": "Seven unpublished novels. And when the book came out, it was quiet. Not much attention. And then, slowly, by word of mouth, people started passing it to each other. It reached the New York Times bestseller list in October 2025, months after publication. It eventually spent eight weeks at number one. NPR reported in January 2026 that it had sold nearly three hundred thousand print copies by then, not counting audio or ebooks. It won the PEN Hemingway Award for a debut novel. And in June 2026 it won the Women's Prize for Fiction, and became the first winner of that prize to go to number one in the overall British charts straight after winning."}, {"cls": "p", "html": "A real sleeper hit. And I love the way it became a hit. Not through a huge marketing campaign. Through people handing it to each other. Book clubs. Friends saying, you have to read this. Which is, when you think about it, how letters travel. One person to another, by hand. A novel about correspondence, spread by correspondence."}, {"cls": "p", "html": "And I have a theory about why it caught on now. We are surrounded by communication, and a lot of people are lonelier than ever. Messages everywhere, and very few of them say anything. And here is a book about a woman who is alone, in her seventies, in a quiet house, and who is not actually lonely in the way you would expect, because she is in constant, deep conversation with people all over the world. On paper. People read it and recognise something they are missing."}, {"cls": "p", "html": "The attention. Her letters are long, considered, specific. She remembers what people told her. She asks follow up questions. She argues with them. She tells them when they are wrong. That is a kind of love, even when it is prickly. Maybe especially when it is prickly. You probably know a few people like that. They are exhausting, and you would never want to lose them."}, {"cls": "p", "html": "And Jane Fonda is going to star in a film adaptation, which I am nervous about, because how do you film letters? A lot of very beautiful voiceover, presumably."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. The grandmother letter is half written. It is the hardest thing I have tried to put on paper. You will have it before spring."}]}, {"n": 31, "date": "March 4, 2027", "meta": "Email from A., R.'s sister, to R.", "kind": "email", "from": "A.", "to": "R.", "body": [{"cls": "salutation", "html": "R.,"}, {"cls": "p", "html": "Mum says you have been writing letters to half your childhood, and that you sounded happier on the phone on Sunday than you have in months, so I am not going to tease you about it, much."}, {"cls": "p", "html": "I have been thinking about it, though. My version of correspondence is a phone. I send a message and watch the little dots that mean someone is typing, and if the dots stop and nothing comes, I spend the next hour wondering what they were going to say. Or I see that they have read it and not replied, and I feel terrible. It is instant and constant and, if I am honest, shallow. Nobody answers my messages point by point. Half the time they answer one thing out of the five I said."}, {"cls": "p", "html": "So I would like to try. You should know that most people my age find the idea terrifying. Also, I do not know where to get stamps."}, {"cls": "sig", "html": "A."}]}, {"n": 32, "date": "March 8, 2027", "meta": "Letter from R. to A.", "kind": "letter", "from": "R.", "to": "A.", "body": [{"cls": "salutation", "html": "Dear A.,"}, {"cls": "p", "html": "You are in very good company. The book I keep going on about has started making people write letters again."}, {"cls": "p", "html": "NPR's books correspondent, Andrew Limbong, said that he got lots of emails from listeners saying the book had inspired them to start writing letters. One of them was a therapist in Austin, Texas, called Carly Bassett. She finished the book on New Year's Eve and set herself a goal of writing twenty six letters in 2026. Then she started a group called the Correspondence Course, where people meet to write letters together."}, {"cls": "p", "html": "And she said something that made me laugh. When she talks to clients, especially young people, about writing letters, one of the biggest barriers is that people do not know where to get stamps."}, {"cls": "p", "html": "Your little dots. The read receipt. The most anxious invention in human history. Nobody reads your message twice. Nobody reads it once, properly. With a letter, you know someone has sat down, with time, and given you their full attention. It is a gift. It is the opposite of the read receipt. A letter says, I have thought about you for an hour. A read receipt says, I have seen you and moved on."}, {"cls": "p", "html": "And bookstores have noticed more interest in their stationery sections, though that is anecdotal. But think about that. A debut novel about a cranky seventy three year old writing letters, and people in their twenties are going to the post office for the first time."}, {"cls": "p", "html": "So let that be your first question to me. Dear R., where does one get stamps? And I will answer it point by point. You asked about stamps. Here is how. You said you were terrified. Here is why you need not be. And here is what has happened to me since we last spoke, which was Sunday, so not very much."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. The post office, or the supermarket checkout. And Mum is right. I am happier."}]}, {"n": 33, "date": "March 14, 2027", "meta": "Letter from A. to R. Her first.", "kind": "letter", "from": "A.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "You asked about stamps. I found them at the supermarket, next to the batteries, which nobody tells you."}, {"cls": "p", "html": "This is my first real letter. I read it twice before I sealed it and then opened it again to add this sentence, which I think means I am doing it properly."}, {"cls": "p", "html": "I told K. about all this at dinner on Friday. K. would like your address, and I said I would ask first."}, {"cls": "closing", "html": "Love,"}, {"cls": "sig", "html": "A."}, {"cls": "ps", "html": "P.S. I put a P.S. in because you said they were important. I do not have anything to put in it yet. This is it."}]}, {"n": 34, "date": "March 17, 2027", "meta": "Postcard from K., cousin, to R.", "kind": "postcard", "from": "K.", "to": "R.", "body": [{"cls": "salutation", "html": "R.,"}, {"cls": "p", "html": "A. says you have started some kind of revolution. I have written three letters this week, and one of them was to the electricity company. I would like to know whether that counts."}, {"cls": "sig", "html": "K."}]}, {"n": 35, "date": "March 22, 2027", "meta": "Letter from M. to R.", "kind": "letter", "from": "M.", "to": "R.", "body": [{"cls": "salutation", "html": "Dear R.,"}, {"cls": "p", "html": "I am going to tell you where I have landed, because I think you have actually moved me."}, {"cls": "p", "html": "I came in thinking letters were just slow messages. Old technology and nostalgia. And I still think a lot of the romance around letters is nostalgia. But you have convinced me that the slowness changes what is said. When you write to one person, across a gap of time, knowing they will read it carefully and answer it point by point, you think differently. You reflect instead of reacting. And you build yourself, in a way, through the versions you tell."}, {"cls": "p", "html": "And I can see why the novel in letters works for the same reason. Nothing happens in real time. Everything arrives already reflected on. And because there are several letters about the same thing, to different people, you get layers, and the reader has to put them together."}, {"cls": "p", "html": "But I want to keep one bit of my scepticism. You said the epistolary life is the most examined life there is. I think it can also be the most edited. When you retell your fortnight to all of your friends, you are not only finding the truth. You are also finding the version you prefer. And I suspect that is partly what Sybil's story is about. A woman who has told herself a certain version of her life, beautifully, in letters, for decades, and has to face the parts she left out."}, {"cls": "p", "html": "So, one more thing. What am I supposed to do with all this?"}, {"cls": "sig", "html": "M."}, {"cls": "ps", "html": "P.S. I have read every one of your letters at least twice. Do not make anything of it."}]}, {"n": 36, "date": "March 28, 2027", "meta": "Letter from R. to M.", "kind": "letter", "from": "R.", "to": "M.", "body": [{"cls": "salutation", "html": "Dear M.,"}, {"cls": "p", "html": "That is very perceptive for someone who has not read it. And you are right. The letters are both her hiding place and her way out. Which is exactly the tension we started with, back in November. Hiding and revealing at once. And the reader becomes the last correspondent, the one who receives everything."}, {"cls": "p", "html": "Sybil, in the end, has to face the parts of her life she left out of her letters. I suspect I left a few things out of mine. There is an old friend who has been waiting since October for one of them."}, {"cls": "p", "html": "What are you supposed to do with all this? Two things. First, read the book. I would lend you my copy, but I want it back, because it is on the favourites shelf."}, {"cls": "p", "html": "And second, write a letter. Not a thank you note. A real one. To someone far away. Ask them a question. And then wait. And then you will find out what it feels like to check the post every day. To carry an envelope around unopened. To read it twice. And to start composing your answer in the shower."}, {"cls": "p", "html": "Though I suspect you already know."}, {"cls": "closing", "html": "With love,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. I have made nothing of it. I have made a great deal of it."}]}, {"n": 37, "date": "April 4, 2027", "meta": "Open letter from R. to all of you, again. Still no address on the envelope.", "kind": "open", "from": "R.", "to": "all of you", "body": [{"cls": "salutation", "html": "Dear all of you, those who have written back and those who have not yet,"}, {"cls": "p", "html": "In October I sent a letter with no address on the envelope. Since then some of you have found me. One of you found a stamp, and a woman at the post office who worried about him. One of you argued with every line I wrote and then confessed to reading them all twice. One of you has counted every time I said fine. My sister has written the first real letter of her life, and my cousin has written to the electricity company, which I have decided counts. None of you know each other, and I have come to think you have a great deal in common."}, {"cls": "p", "html": "You asked me, more or less, why anyone would still write letters, when a message takes a second and a letter takes a week. Here is my answer, point by point."}, {"cls": "p", "html": "One. Because a week is how long it takes to think properly about another person."}, {"cls": "p", "html": "Two. Because you will read this twice, and I will have known you would, and so I chose every word."}, {"cls": "p", "html": "Three. Because when you are old, and you find a letter like this in a drawer, you will remember exactly where you were when it came, and the bad coffee, and the fact that you did not know where to get stamps."}, {"cls": "p", "html": "And now, since my last letter, here is what has happened to me. I read a book about a difficult old woman who wrote letters, and it reminded me who I used to be. And then you wrote back."}, {"cls": "p", "html": "The scholars say a correspondence ends when someone stops writing, or dies, or arrives in person, or the last letter goes unanswered. I would like to choose none of these. So I am asking for more. More letters from those of you who have started, and first letters from those of you who have not. You do not need a reason, and you do not need to be good at it. Ask me a question, and then wait."}, {"cls": "closing", "html": "With love, and expecting a reply,"}, {"cls": "sig", "html": "R."}, {"cls": "ps", "html": "P.S. This is still the only way I can think of to reach the rest of you. If you were the boy with the green ink, or the girl with the thin blue airmail paper, or the one who drew cartoons in the margins, or whoever sent me a feather with no explanation, and somehow, by some strange chance, this reaches you, then I would love to hear from you. You do not have to answer point by point. You do not even have to remember me very well. Just tell me what has happened to you since your last letter. It has been a long interval. I imagine there is a lot to say. And if there is someone you used to write to, and lost, maybe this is your nudge too. Somewhere out there, there are letters folded inside old books, waiting for someone to open them."}]}];
const KIND = { letter: 'Letter', email: 'Email', postcard: 'Postcard', card: 'Card', open: 'Open letter' };
const stack = document.getElementById('stack');
const nextBtn = document.getElementById('next');
const prevBtn = document.getElementById('prev');
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

function shortDate(d) { const m = d.match(/^(\w+) (\d+), (\d+)$/); return m ? { md: m[1].slice(0, 3) + ' ' + m[2], y: m[3] } : { md: d, y: '' }; }
function paras(list) { return list.map(b => `<p class="${b.cls}">${b.html}</p>`).join(''); }
function postmark(l) { const s = shortDate(l.date); return `<div class="postmark" aria-hidden="true"><div>${l.kind === 'email' ? 'Sent' : 'Posted'}<b>${s.md}</b>${s.y}</div></div>`; }

function render(l) {
  const el = document.createElement('article');
  el.className = 'sheet ' + l.kind;
  el.id = 'letter-' + l.n;
  el.setAttribute('aria-label', `${KIND[l.kind]} from ${l.from} to ${l.to}, ${l.date}`);
  if (l.kind === 'email') {
    el.innerHTML = `<div class="bar"><span>From</span><span>${l.from}</span><span>To</span><span>${l.to}</span><span>Date</span><span>${l.date}</span></div><div class="content">${paras(l.body)}</div>`;
  } else if (l.kind === 'postcard') {
    el.innerHTML = `<div class="msg"><div class="head"><div class="who">${l.date}<span class="meta">${l.meta}</span></div></div>${paras(l.body)}</div><div class="addr"><div class="stamp" aria-hidden="true">Post</div>${postmark(l)}<div class="lines" aria-hidden="true"><div>${l.to}</div><div></div><div></div></div></div>`;
  } else {
    el.innerHTML = `<div class="head"><div class="who">${l.date}<span class="meta">${l.meta}</span></div>${postmark(l)}</div>${paras(l.body)}`;
  }
  return el;
}

const frag = document.createDocumentFragment();
LETTERS.forEach(l => { const slot = document.createElement('section'); slot.className = 'slot'; slot.appendChild(render(l)); frag.appendChild(slot); });
stack.appendChild(frag);
const sheets = [...stack.querySelectorAll('.slot')];

const LINE = window.innerHeight * 0.45;
function currentIndex() {
  let cur = -1;
  sheets.forEach((el, i) => { if (el.getBoundingClientRect().top <= LINE) cur = i; });
  return cur;
}
function go(i) {
  if (i < 0) { window.scrollTo({ top: 0, behavior: smooth() }); return; }
  sheets[Math.min(i, sheets.length - 1)].scrollIntoView({ behavior: smooth(), block: 'start' });
}
function goNext() { go(currentIndex() + 1); }
function goPrev() {
  const i = currentIndex();
  if (i < 0) return;
  const top = sheets[i].getBoundingClientRect().top;
  go(top < -40 ? i : i - 1);
}
function update() {
  const i = currentIndex();
  const atEnd = i >= sheets.length - 1;
  nextBtn.disabled = atEnd;
  prevBtn.disabled = window.scrollY < 10;
  try { localStorage.setItem('pbp-at', String(Math.max(i, 0))); } catch (e) {}
}
let ticking = false;
window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { update(); ticking = false; }); } }, { passive: true });

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
document.getElementById('top').addEventListener('click', () => go(0));
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, button')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
});

try { const v = parseInt(localStorage.getItem('pbp-at'), 10); if (v > 0 && v < sheets.length) sheets[v].scrollIntoView({ block: 'start' }); } catch (e) {}
update();
</script>

</body>
</html>
